---
x-airflow-common: &airflow-common
  build: ./airflow
  image: airflow-gnn-training:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    MLFLOW_TRACKING_URI: "http://mlflow-server:5500"
    MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
    # GNN-specific environment variables
    NEO4J_URI: "bolt://neo4j:7687"
    NEO4J_USER: "neo4j"
    NEO4J_PASSWORD: "gnnpassword"
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ./models:/app/models
    - ./data:/app/data
    - ./configs:/app/configs
    - ./.env:/app/.env
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    neo4j:
      condition: service_healthy

services:
  # ===========================================
  # INFRASTRUCTURE SERVICES
  # ===========================================
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - fraud-detection

  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always
    networks:
      - fraud-detection

  # ===========================================
  # GRAPH DATABASE
  # ===========================================
  neo4j:
    image: neo4j:5.23-community
    container_name: neo4j-graph-db
    environment:
      - NEO4J_AUTH=neo4j/gnnpassword
      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "gnnpassword", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: always
    networks:
      - fraud-detection

  # ===========================================
  # STREAM PROCESSING
  # ===========================================
  flink-jobmanager:
      image: flink:1.18-scala_2.12-java11
      container_name: flink-jobmanager
      command: jobmanager
      environment:
        - FLINK_PROPERTIES=jobmanager.rpc.address:flink-jobmanager
        - FLINK_PROPERTIES=taskmanager.numberOfTaskSlots:4
        - FLINK_PROPERTIES=parallelism.default:2
        - FLINK_PROPERTIES=jobmanager.memory.process.size:1600m
        - FLINK_PROPERTIES=taskmanager.memory.process.size:1728m
      ports:
        - "8081:8081"
      volumes:
        - flink-checkpoints:/checkpoints
        - flink-savepoints:/savepoints
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8081/"]
        interval: 30s
        timeout: 10s
        retries: 3
      networks:
        - fraud-detection

  flink-taskmanager:
      image: flink:1.18-scala_2.12-java11
      depends_on:
        - flink-jobmanager
      command: taskmanager
      environment:
        - FLINK_PROPERTIES=jobmanager.rpc.address:flink-jobmanager
        - FLINK_PROPERTIES=taskmanager.numberOfTaskSlots:4
        - FLINK_PROPERTIES=parallelism.default:2
        - FLINK_PROPERTIES=taskmanager.memory.process.size:1728m
      volumes:
        - flink-checkpoints:/checkpoints
        - flink-savepoints:/savepoints
      deploy:
        replicas: 2
      networks:
        - fraud-detection

  # ===========================================
  # AIRFLOW SERVICES (Enhanced)
  # ===========================================
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    deploy:
      mode: replicated
      replicas: 2
    networks:
      - fraud-detection

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "Setting AIRFLOW_UID to 50000 for container compatibility"
          export AIRFLOW_UID=50000
        fi
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources
    networks:
      - fraud-detection

  # ===========================================
  # ML & STORAGE SERVICES
  # ===========================================
  minio:
    restart: always
    image: minio/minio:latest
    platform: linux/amd64
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ':9001' --address ':9000'
    environment:
      - MINIO_ROOT_USER=${MINIO_USERNAME:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - fraud-detection

  mc:
    image: minio/mc:latest
    platform: linux/amd64
    depends_on:
      minio:
        condition: service_healthy
    container_name: mc
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      /tmp/wait-for-it.sh minio:9000 &&
      /usr/bin/mc alias set minio http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin} &&
      /usr/bin/mc mb minio/mlflow --ignore-existing &&
      /usr/bin/mc mb minio/graph-embeddings --ignore-existing &&
      /usr/bin/mc mb minio/model-artifacts --ignore-existing;
      exit 0;
      "
    volumes:
      - ./wait-for-it.sh:/tmp/wait-for-it.sh
    networks:
      - fraud-detection

  mlflow-server:
    restart: always
    build: ./mlflow
    image: mlflow-server
    container_name: mlflow-server
    depends_on:
      - mc
      - postgres
    ports:
      - "5500:5500"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: mlflow server --port 5500 --host 0.0.0.0 --backend-store-uri postgresql+psycopg2://mlflow:mlflow@postgres/mlflow --default-artifact-root s3://mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fraud-detection

  # ===========================================
  # GNN TRAINING & PROCESSING SERVICES
  # ===========================================
  gnn-training:
    build:
      context: .
      dockerfile: ./docker/gnn-training.dockerfile
    container_name: gnn-training
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=gnnpassword
      - MLFLOW_TRACKING_URI=http://mlflow-server:5500
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./configs:/app/configs
      - ./.env:/app/.env
    depends_on:
      neo4j:
        condition: service_healthy
      mlflow-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    networks:
      - fraud-detection

  graph-processor:
    build:
      context: .
      dockerfile: ./docker/graph-processor.dockerfile
    container_name: graph-processor
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=gnnpassword
      - FLINK_JOBMANAGER_HOST=flink-jobmanager
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./configs:/app/configs
      - flink-checkpoints:/checkpoints
    depends_on:
      - neo4j
      - flink-jobmanager
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
    networks:
      - fraud-detection

  streaming-processor:
    build:
      context: .
      dockerfile: ./docker/streaming-processor.dockerfile
    container_name: streaming-processor
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=gnnpassword
      - FLINK_JOBMANAGER_HOST=flink-jobmanager
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - flink-checkpoints:/checkpoints
    depends_on:
      - flink-jobmanager
      - graph-processor
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
    networks:
      - fraud-detection

  # ===========================================
  # INFERENCE SERVICES
  # ===========================================
  gnn-inference:
    build:
      context: .
      dockerfile: ./docker/inference-service.dockerfile
    container_name: gnn-inference
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=gnnpassword
      - MLFLOW_TRACKING_URI=http://mlflow-server:5500
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./configs:/app/configs
    ports:
      - "8000:8000"  # API endpoint
    depends_on:
      - neo4j
      - mlflow-server
      - gnn-training
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    networks:
      - fraud-detection

  # ===========================================
  # DATA GENERATION & NOTIFICATION
  # ===========================================
  producer:
    build: ./producer
    env_file: .env
    environment:
      - KAFKA_TOPIC=transactions
      - PYTHONPATH=/app
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - fraud-detection

  notification:
    build: ./notification
    env_file: .env
    volumes:
      - ./configs:/app/configs
    environment:
      - SMTP_HOST=maildev
      - SMTP_PORT=1025
      - SMTP_FROM=fraud.alerts@bank.com
      - KAFKA_FRAUD_TOPIC=fraud_predictions
    depends_on:
      - maildev
    networks:
      - fraud-detection

  maildev:
    image: maildev/maildev:latest
    container_name: maildev
    ports:
      - "1080:1080"  # Web interface
      - "1025:1025"  # SMTP server
    environment:
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    networks:
      - fraud-detection

  # ===========================================
  # MONITORING & OBSERVABILITY
  # ===========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - fraud-detection

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - fraud-detection

  # ===========================================
  # OPTIONAL DEBUG SERVICES
  # ===========================================
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    networks:
      - fraud-detection

  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - fraud-detection

# ===========================================
# VOLUMES
# ===========================================
volumes:
  postgres-db-volume:
  minio_data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  flink-checkpoints:
  flink-savepoints:
  prometheus-data:
  grafana-data:

# ===========================================
# NETWORKS
# ===========================================
networks:
  fraud-detection:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

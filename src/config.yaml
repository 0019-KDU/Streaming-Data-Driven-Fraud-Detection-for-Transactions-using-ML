mlflow:
  experiment_name: "fraud_detection"
  registered_model_name: "fraud_detection_xgboost"
  tracking_uri: "http://mlflow-server:5500"
  artifact_location: "s3://mlflow/fraud_detection"
  s3_endpoint_url: "http://minio:9000"
  bucket: "mlflow"
  model_stage: "Production"
  

kafka:
  bootstrap_servers: "pkc-921jm.us-east-2.aws.confluent.cloud:9092"
  username: "TUISIFY5HCFLGXIH"
  password: "HIhrR1hP0Oj64llWYN8E4U3gnsJ83b64OGcrFDYvnkTppiMo1UkMwUUdfSFr6PLl"
  topic: "transactions"
  output_topic: "fraud_predictions"
  legit_topic: "legit_predictions"
  reply_topic: "transaction_replies"  # For sync scoring (optional)
  security_protocol: "SASL_SSL"

# IEEE-CIS Dataset Configuration
data:
  ieee_cis:
    train_transaction_path: "/app/data/ieee_cis/train_transaction.csv"
    train_identity_path: "/app/data/ieee_cis/train_identity.csv"
    chronological_split_ratio: 0.80  # 80% earliest for train, 20% latest for validation

# Training Configuration
training:
  use_external_model: true  # Set to true to use model from fyp.ipynb, false to retrain
  model_path: "/app/models/fraud_detection_model.pkl"
  feature_pipeline_path: "/app/models/feature_pipeline.pkl"
  experiment_name: "ieee_cis_fraud_detection"
  force_cpu_only: true  # Skip GPU attempts, use CPU directly (for VMs without GPU)
  # SMOTE configuration for class imbalance handling
  use_smote: true
  smote_sampling_strategy: 0.15  # 15% of majority class (reduced from 0.3 - less synthetic noise)
  
  # 🆕 PHASE 2 & 3: Advanced Techniques for 96%+ AUC (Top 5% Kaggle)
  use_forward_feature_selection: false  # ❌ DISABLED: Use all features
  ffs_max_features: 50  # Stop FFS after 50 features (kept for later tuning)
  
  # 🔥 OPTUNA HYPERPARAMETER TUNING (CRITICAL FOR 0.90+ AUC)
  use_optuna_tuning: true  # ✅ ENABLED: Smart hyperparameter optimization
  optuna_trials: 100  # 50=30min(0.82-0.85), 100=60min(0.85-0.88)⭐, 150=90min(0.88-0.91)
  
  # ⚠️ DEPRECATED: Use Optuna instead of RandomizedSearchCV
  use_randomized_search: false  # Old method, kept for backward compatibility
  random_search_iterations: 10  # Not used when Optuna is enabled
  # Alternate imbalance strategy: when true, training code should compute scale_pos_weight = n_legit / n_fraud
  scale_pos_weight_auto: true
  # Enable CV-based target encoding (k-fold target encoding) to avoid leakage
  use_cv_target_encoding: true

model:
  test_size: 0.2
  seed: 42
  params:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 1
    tree_method: "hist"
  path: "/app/models/fraud_detection_model.pkl"
  feature_pipeline_path: "/app/models/feature_pipeline.pkl"

# Inference Configuration (No VAE)
inference:
  threshold: 0.15  # Lowered base threshold (no VAE anomaly score)
  risk_bands:
    high: 0.30    # Adjusted for non-VAE predictions
    medium: 0.15  # Adjusted for non-VAE predictions
  # Rule-based flags will still catch high-risk transactions
  rule_based_thresholds:
    very_high_amount: 10000.0
    very_low_amount: 1.0
    high_velocity_score: 0.7
    rapid_transactions_1h: 5
    amount_spike_1h: 0.8
  sync_scoring_timeout_ms: 2000  # Timeout for synchronous scoring (optional feature)

# Dashboard Configuration
dashboard:
  port: 8501  # Streamlit default port
  refresh_interval_seconds: 2
  max_display_rows: 100

spark:
  app_name: "FraudDetectionInference"
  packages: "org.mlflow:mlflow-spark:2.6.0,com.google.guava:guava:30.1.1-jre,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.4,org.apache.hadoop:hadoop-aws:3.3.0,com.amazonaws:aws-java-sdk:1.11.469"
  shuffle_partition: 200
  checkpoint_location: 'checkpoints'
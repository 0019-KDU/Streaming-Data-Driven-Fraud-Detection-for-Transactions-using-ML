# Training configuration (Airflow DAGs mount this at /app/config.yaml).
# The inference services use src/inference/config.yaml instead.
# Kafka connection details and credentials come from environment variables (src/.env).

mlflow:
  tracking_uri: "http://mlflow-server:5500"
  s3_endpoint_url: "http://minio:9000"
  bucket: "mlflow"

kafka:
  topic: "transactions"
  output_topic: "fraud_predictions"
  legit_topic: "legit_predictions"

# ---------------------------------------------------------------------------
# IEEE-CIS benchmark model  (DAG: ieee_cis_fraud_detection_training)
# ---------------------------------------------------------------------------
data:
  ieee_cis:
    train_transaction_path: "/app/data/ieee_cis/train_transaction.csv"
    train_identity_path: "/app/data/ieee_cis/train_identity.csv"

training:
  experiment_name: "ieee_cis_fraud"
  model_path: "/app/models/fraud_detection_model.pkl"
  feature_pipeline_path: "/app/models/feature_pipeline.pkl"
  results_path: "/app/models/metrics_ieee_cis.json"

  # Chronological split by TransactionDT: train | early-stop | calibration | gap | test
  split:
    train_fraction: 0.65
    early_stop_fraction: 0.10
    calibration_fraction: 0.10
    gap_days: 7                # label-maturity gap before the untouched test period

  calibration_method: "sigmoid" # Platt scaling on the calibration split only

  # Thresholds come from money, not F1 (see src/dags/evaluation.py)
  cost_model:
    margin: 0.10               # profit share of a legitimate sale
    chargeback_fee: 15.0       # fee per chargeback
    friction_cost: 2.0         # cost of wrongly declining / reviewing a good customer
  daily_review_budget: 100     # analyst capacity: sizes the REVIEW band

  xgboost:
    n_estimators: 2000         # upper bound; early stopping picks the real number
    learning_rate: 0.03
    max_depth: 8
    subsample: 0.8
    colsample_bytree: 0.5
    min_child_weight: 5
    early_stopping_rounds: 100
    # scale_pos_weight: omitted = n_legit / n_fraud of the training split

# ---------------------------------------------------------------------------
# Decision-time model served live  (DAG: decision_time_fraud_training)
# ---------------------------------------------------------------------------
synthetic:
  data_path: "/app/data/synthetic/transactions.parquet"   # generated on first run
  model_path: "/app/models/decision_time_model.pkl"
  results_path: "/app/models/metrics_decision_time.json"
  simulator:
    n_customers: 5000
    n_terminals: 10000
    n_days: 180
    seed: 42
  split_days:
    warmup: 7
    train_end: 105
    early_stop_end: 120
    calibration_end: 135
    test_start: 150            # training happens "on day 150": later chargebacks are unknown
    test_end: 180
  xgboost:
    n_estimators: 1000
    learning_rate: 0.05
    max_depth: 6
